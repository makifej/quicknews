name: Hírek frissítése

# Indítás: a Cloudflare Worker (indito/) negyedóránként hív workflow_dispatch-csel.
# A GitHub saját ütemezője csak tartalék, mert megbízhatatlan.
on:
  workflow_dispatch:
    inputs:
      kenyszer:
        description: "Éjszaka is fusson (kézi indításhoz)"
        type: boolean
        default: false
  schedule:
    - cron: "7,37 6-21 * * *"

concurrency:
  group: frissites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  frissit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # SEC-005: a titkok csak abba a lépésbe kerülnek, amelyiknek kell (a csomagtelepítés és a git nem látja őket)
    env:
      TZ: Europe/Budapest
      VAN_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Éjszakai szünet (23:00 és 08:00 között nem fut, magyar idő)
        id: ido
        run: |
          ORA=$(date +%H)
          if [ "${{ inputs.kenyszer }}" != "true" ] && { [ "$ORA" -ge 23 ] || [ "$ORA" -lt 8 ]; }; then echo "fut=nem" >> $GITHUB_OUTPUT; else echo "fut=igen" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.ido.outputs.fut == 'igen'
        with:
          fetch-depth: 1
      - name: Titkosított fájlok feloldása (git-crypt)
        if: steps.ido.outputs.fut == 'igen'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get install -y -qq git-crypt >/dev/null
          echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/gc.key
          git-crypt unlock /tmp/gc.key
          rm -f /tmp/gc.key
          if head -c 9 build/render.py | grep -q GITCRYPT; then echo "A feloldás nem sikerült"; exit 1; fi
          echo "feloldva"
      - uses: actions/setup-python@v5
        if: steps.ido.outputs.fut == 'igen'
        with:
          python-version: "3.12"
      - if: steps.ido.outputs.fut == 'igen'
        run: pip install -q -r requirements.txt
      - name: Gyűjtés, fordítás, linkek, renderelés
        if: steps.ido.outputs.fut == 'igen'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 build/gyujt.py --nem-tipus x_profil --nem-forras producthunt
          python3 build/fordit.py
          python3 build/kiprobal_potlo.py --ir
          python3 build/termek_linkelo.py --ir
          python3 build/entitas_link.py
          python3 build/link_ellenor.py
          python3 build/rovat_csoport.py
          python3 build/render.py
      - name: Változások visszaírása (a titkosított útvonalak újra titkosítva mennek)
        if: steps.ido.outputs.fut == 'igen'
        run: |
          git config user.name "makifej"
          git config user.email "149273611+makifej@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then echo "nincs változás"; exit 0; fi
          git commit -m "Frissítés: $(date '+%Y-%m-%d %H:%M')"
          # ütközésnél a generált fájloknál a mi friss változatunk nyer; a máshol törölt fájlt (modify/delete) töröljük,
          # hogy a rebase ne akadjon el (2026-10-11: egy átnevezett fájl miatt bukott el a futás)
          rebase() {
            git pull --rebase -X theirs && return 0
            git status --porcelain | awk '/^(DU|UD|DD) /{print $2}' | xargs -r git rm -q --
            git add -A data site
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; return 1; }
          }
          for i in 1 2 3; do git push && break || { rebase; sleep 5; }; done
          git push  # ha 3 próbából sem ment fel, a futás jogosan bukjon el
      - name: Kiadás a Vercelre
        if: steps.ido.outputs.fut == 'igen' && env.VAN_VERCEL == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # rögzített verzió: egy új, esetleg kompromittált CLI-kiadás nem kaphatja meg automatikusan a tokent
        run: npx --yes vercel@63.1.2 deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      - name: IndexNow (az új hírek beküldése a keresőknek)
        if: steps.ido.outputs.fut == 'igen' && env.VAN_VERCEL == 'true'
        run: |
          python3 build/indexnow.py || true
          git add data/indexnow_kuldve.json
          if ! git diff --cached --quiet; then git commit -q -m "IndexNow-nyilvántartás"; for i in 1 2 3; do git push -q && break || { git pull -q --rebase -X theirs && sleep 5; }; done; fi
