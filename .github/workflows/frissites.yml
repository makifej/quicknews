name: Hírek frissítése

# Indítás: a Cloudflare Worker (indito/) negyedóránként hív workflow_dispatch-csel.
# A GitHub saját ütemezője csak tartalék, mert megbízhatatlan.
on:
  workflow_dispatch:
    inputs:
      kenyszer:
        description: "Éjszaka is fusson (kézi indításhoz)"
        type: boolean
        default: false
  schedule:
    - cron: "7,37 6-21 * * *"

concurrency:
  group: frissites
  cancel-in-progress: false

# SEC-005 (2026-10-11): három, egymástól elzárt rész. A kulcsok nincsenek egy helyen:
#   frissit  - gyűjtés, fordítás, renderelés, visszaírás: git-crypt kulcs, Gemini-kulcs, push-jog (Vercel-kulcs NINCS)
#   kiadas   - élesítés tiszta gépen: csak a kész oldalcsomag és a Vercel-kulcs (repó, git-crypt, Python NINCS)
#   indexnow - a keresők értesítése élesítés után: git-crypt kulcs és push-jog (Vercel- és Gemini-kulcs NINCS)
# Az actionök commit-SHA-ra, a Python-csomagok hash-re, a vercel CLI pontos verzióra rögzítve.
permissions: {}

jobs:
  frissit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      fut: ${{ steps.ido.outputs.fut }}
      kod: ${{ github.sha }}
      kezdet: ${{ steps.ido.outputs.kezdet }}
    env:
      TZ: Europe/Budapest
    steps:
      - name: Éjszakai szünet (23:00 és 08:00 között nem fut, magyar idő)
        id: ido
        run: |
          ORA=$(date +%H)
          if [ "${{ inputs.kenyszer }}" != "true" ] && { [ "$ORA" -ge 23 ] || [ "$ORA" -lt 8 ]; }; then echo "fut=nem" >> $GITHUB_OUTPUT; else echo "fut=igen" >> $GITHUB_OUTPUT; fi
          echo "kezdet=$(date +%s)000" >> $GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.ido.outputs.fut == 'igen'
        with:
          fetch-depth: 1
      - name: Titkosított fájlok feloldása (git-crypt)
        if: steps.ido.outputs.fut == 'igen'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get install -y -qq git-crypt >/dev/null
          echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/gc.key
          git-crypt unlock /tmp/gc.key
          rm -f /tmp/gc.key
          if head -c 9 build/render.py | grep -q GITCRYPT; then echo "A feloldás nem sikerült"; exit 1; fi
          echo "feloldva"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.ido.outputs.fut == 'igen'
        with:
          python-version: "3.12"
      - if: steps.ido.outputs.fut == 'igen'
        run: pip install -q --require-hashes -r requirements.txt
      - name: Gyűjtés, fordítás, linkek, renderelés
        if: steps.ido.outputs.fut == 'igen'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 build/gyujt.py --nem-tipus x_profil --nem-forras producthunt
          python3 build/fordit.py
          python3 build/kiprobal_potlo.py --ir
          python3 build/termek_linkelo.py --ir
          python3 build/entitas_link.py
          python3 build/link_ellenor.py
          python3 build/forras_kutato.py
          python3 build/rovat_csoport.py
          python3 build/render.py
      - name: Változások visszaírása (a titkosított útvonalak újra titkosítva mennek)
        if: steps.ido.outputs.fut == 'igen'
        run: |
          git config user.name "makifej"
          git config user.email "149273611+makifej@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then echo "nincs változás"; exit 0; fi
          git commit -m "Frissítés: $(date '+%Y-%m-%d %H:%M')"
          # ütközésnél a generált fájloknál a mi friss változatunk nyer; a máshol törölt fájlt (modify/delete) töröljük,
          # hogy a rebase ne akadjon el (2026-10-11: egy átnevezett fájl miatt bukott el a futás)
          rebase() {
            git pull --rebase -X theirs && return 0
            git status --porcelain | awk '/^(DU|UD|DD) /{print $2}' | xargs -r git rm -q --
            git add -A data site
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; return 1; }
          }
          for i in 1 2 3; do git push && break || { rebase; sleep 5; }; done
          git push  # ha 3 próbából sem ment fel, a futás jogosan bukjon el
      - name: A kész oldal csomagolása a kiadáshoz (csak a kiszolgált fájlok, titok nélkül)
        if: steps.ido.outputs.fut == 'igen'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kiadas
          path: |
            site
            api
            vercel.json
            .vercelignore
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  kiadas:
    needs: frissit
    if: needs.frissit.outputs.fut == 'igen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      # 2026-10-12: ha a futás közben újabb kód került fel (a gépről élesített javítás), ez a kör NEM élesít,
      # különben a régi kóddal renderelt oldal felülírná a gépről kitett újabbat. A következő kör már az új kóddal megy.
      - name: Újabb kód ellenőrzése
        id: kod
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          valtozott=$(gh api "repos/${{ github.repository }}/compare/${{ needs.frissit.outputs.kod }}...main" --jq '[.files[]?.filename | select(startswith("build/") or startswith("api/") or . == "vercel.json")] | length' 2>/dev/null || echo 0)
          if [ "${valtozott:-0}" -gt 0 ]; then echo "Futás közben $valtozott kódfájl változott: ez a kör nem élesít."; echo "mehet=nem" >> $GITHUB_OUTPUT; exit 0; fi
          # ha a futás közben valaki (Heni gépéről) élesített, az újabb: ez a kör nem írhatja felül
          utolso=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1" | jq -r '.deployments[0].created // 0')
          if [ "${utolso:-0}" -gt "${{ needs.frissit.outputs.kezdet }}" ]; then echo "A futás közben gépről élesítettek ($utolso): ez a kör nem írja felül."; echo "mehet=nem" >> $GITHUB_OUTPUT; else echo "mehet=igen" >> $GITHUB_OUTPUT; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: steps.kod.outputs.mehet == 'igen'
        with:
          name: kiadas
          path: kiadas
      - name: Kiadás a Vercelre
        if: steps.kod.outputs.mehet == 'igen'
        working-directory: kiadas
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "nincs Vercel-kulcs, kihagyva"; exit 0; fi
          # 2026-10-13: a kiadás azonosítóját eddig a 'dpl_' mintával kerestük, de a CLI nem azt írja ki, ezért a $sajat
          # mindig üres volt, és a gépi kiadás visszatevése SOHA nem futott le (az X-forrásképek így tűntek el).
          # Most a saját kiadás az indítás időpontjából ismerhető fel, a gépi kiadás pedig bármelyik másik, ami a
          # futás kezdete óta készült: azt tesszük vissza élesre, akár a miénk előtt, akár utána indult.
          elott=$(date +%s%3N)
          npx --yes vercel@63.1.2 deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" > vercel-kimenet.txt 2>&1 || true
          tail -3 vercel-kimenet.txt
          # a saját kiadás a CLI kimenetéből („Production  https://quicknews-….vercel.app”); tartalék: az indítás ideje
          sajat=$(grep -o 'https://quicknews-[a-z0-9]*-h-novaks-projects\.vercel\.app' vercel-kimenet.txt | head -1 | sed 's#https://##')
          sleep 25  # a futás közben indult gépi kiadás is érjen a READY állapotba
          lista=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=10")
          if [ -z "$sajat" ]; then
            sajat=$(echo "$lista" | jq -r --argjson e "$elott" '[.deployments[] | select(.created >= $e - 5000)] | sort_by(.created) | first | .url // empty')
          fi
          echo "élesítve: $sajat (indítás: $elott, legutóbbi kiadás: $(echo "$lista" | jq -r '.deployments[0] | "\(.url) \(.created)"'))"
          masik=$(echo "$lista" | jq -r --arg s "$sajat" --argjson k "${{ needs.frissit.outputs.kezdet }}" \
              '[.deployments[] | select(.url != $s and .created > $k and .state == "READY")] | sort_by(.created) | last | .url // empty')
          eles=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.targets.production.url // empty')
          echo "éles most: $eles"
          if [ -z "$sajat" ]; then
            # a saját kiadás nem jött létre (pl. a Vercel elutasította): nincs mit visszatenni, az éles a gépi marad
            echo "::warning::a felhős kiadás nem jött létre, az éles változat marad: $eles"
          elif [ -n "$masik" ] && [ "$masik" != "$eles" ]; then
            echo "A futás közben gépről is élesítettek ($masik): az kerül vissza élesre."
            for i in 1 2 3; do
              # a 409 („már ez az éles”) nem hiba
              ki=$(npx --yes vercel@63.1.2 promote "https://$masik" --yes --token "$VERCEL_TOKEN" 2>&1) && break
              echo "$ki" | grep -q "already the current production" && break
              echo "$ki" | tail -2; sleep 15
            done
            # ellenőrzés: tényleg a gépi kiadás az éles?
            eles=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.targets.production.url // empty')
            echo "éles most: $eles"
            [ "$eles" = "$masik" ] || { echo "::error::a gépi kiadás visszatevése nem sikerült"; exit 1; }
          elif [ -n "$masik" ]; then
            echo "A futás közben gépről is élesítettek ($masik), és már az az éles: nincs teendő."
          fi

  indexnow:
    needs: kiadas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: Europe/Budapest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Titkosított fájlok feloldása (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get install -y -qq git-crypt >/dev/null
          echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/gc.key
          git-crypt unlock /tmp/gc.key
          rm -f /tmp/gc.key
      - name: IndexNow (az új hírek beküldése a keresőknek)
        run: |
          git config user.name "makifej"
          git config user.email "149273611+makifej@users.noreply.github.com"
          python3 build/indexnow.py || true
          git add data/indexnow_kuldve.json
          if ! git diff --cached --quiet; then git commit -q -m "IndexNow-nyilvántartás"; for i in 1 2 3; do git push -q && break || { git pull -q --rebase -X theirs && sleep 5; }; done; fi
